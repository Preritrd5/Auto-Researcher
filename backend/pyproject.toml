[project]
name = "auto-researcher-backend"
version = "0.1.0"
description = "Backend services for Auto-Researcher v1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.40",
  "greenlet>=3.1.1",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.21.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "httpx>=0.28.1",
  "redis>=5.2.1",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "python-slugify>=8.0.4",
  "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-asyncio>=0.26.0",
  "anyio>=4.9.0",
  "ruff>=0.11.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
