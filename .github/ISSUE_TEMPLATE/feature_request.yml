name: Feature request
description: Suggest a new capability or improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Clear problem framing is more helpful than a long implementation sketch.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the feature request
      placeholder: Add resumable batch literature import for long-running scans
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the solution you want at a high level
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend orchestration
        - Model providers
        - Retrieval and citation
        - Runtime execution
        - Frontend UX
        - Docs
        - DevEx / CI
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
