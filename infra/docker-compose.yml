services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auto_researcher}
      POSTGRES_USER: ${POSTGRES_USER:-auto_researcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auto_researcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://auto_researcher:auto_researcher@postgres:5432/auto_researcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACTS_ROOT: /app/artifacts
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - ..:/app
    working_dir: /app/backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  backend-worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://auto_researcher:auto_researcher@postgres:5432/auto_researcher}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARTIFACTS_ROOT: /app/artifacts
    command: ["uv", "run", "python", "worker.py"]
    volumes:
      - ..:/app
    working_dir: /app/backend
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]
    volumes:
      - ..:/app
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  postgres_data:

