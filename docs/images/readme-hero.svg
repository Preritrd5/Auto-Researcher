      <text x="1000" y="408" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#172723">Idea ranking</text>
    </g>

    <g>
      <rect x="982" y="428" width="142" height="42" rx="16" fill="#E7F4EF"/>
      <text x="1000" y="446" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#0F6D57" letter-spacing="0.16em">STAGE 8</text>
      <text x="1000" y="460" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#172723">Run + repair loop</text>
    </g>

    <g>
      <rect x="982" y="480" width="142" height="42" rx="16" fill="#F7F1E8"/>
      <text x="1000" y="498" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#B06A18" letter-spacing="0.16em">STAGE 10</text>
      <text x="1000" y="512" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#172723">Paper export</text>
