<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Researcher Hero</title>
  <desc id="desc">Hero illustration for the Auto-Researcher README, showing the product identity, multilingual dashboard, and research pipeline from idea to paper.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="48" x2="1184" y2="688" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F2E8"/>
      <stop offset="0.55" stop-color="#F1E8DA"/>
      <stop offset="1" stop-color="#E6D9C7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(178 120) rotate(24.91) scale(366.749 252.389)">
      <stop stop-color="#0F6D57" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#0F6D57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1096 148) rotate(157.011) scale(323.051 228.03)">
      <stop stop-color="#B06A18" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B06A18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#FAF1E5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F6D57"/>
      <stop offset="1" stop-color="#1D8B6E"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1360" height="800" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#2C3A35" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20" y="-20" width="1320" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#3B2C1C" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1280" height="720" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="36" fill="url(#glowA)"/>
  <rect width="1280" height="720" rx="36" fill="url(#glowB)"/>

  <g opacity="0.38">
