    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1088 142) rotate(158) scale(326 232)">
      <stop stop-color="#B06A18" stop-opacity="0.18"/>
