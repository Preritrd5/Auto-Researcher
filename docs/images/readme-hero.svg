    <rect x="248" y="446" width="120" height="38" rx="19" fill="#F5ECDF"/>
    <text x="308" y="470" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#435651">Next.js UI</text>

    <rect x="380" y="446" width="128" height="38" rx="19" fill="#F5ECDF"/>
    <text x="444" y="470" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#435651">Claude / GPT / Qwen</text>

    <rect x="520" y="446" width="118" height="38" rx="19" fill="#F5ECDF"/>
    <text x="579" y="470" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#435651">Local / Docker / SSH</text>
  </g>

