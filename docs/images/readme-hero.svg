<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Researcher Hero</title>
  <desc id="desc">Hero illustration for the Auto-Researcher README, showing the product identity, multilingual dashboard, and research pipeline from idea to paper.</desc>
  <defs>
