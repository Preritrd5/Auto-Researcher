      <stop offset="0.55" stop-color="#F1E8DA"/>
      <stop offset="1" stop-color="#E6D9C7"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(194 122) rotate(25) scale(390 260)">
      <stop stop-color="#0F6D57" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0F6D57" stop-opacity="0"/>
