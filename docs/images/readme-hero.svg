    <path d="M0 181H1280" stroke="#0F6D57" stroke-opacity="0.08"/>
    <path d="M0 271H1280" stroke="#0F6D57" stroke-opacity="0.08"/>
    <path d="M0 361H1280" stroke="#0F6D57" stroke-opacity="0.08"/>
    <path d="M0 451H1280" stroke="#0F6D57" stroke-opacity="0.08"/>
    <path d="M0 541H1280" stroke="#0F6D57" stroke-opacity="0.08"/>
    <path d="M0 631H1280" stroke="#0F6D57" stroke-opacity="0.08"/>
    <path d="M123 0V720" stroke="#0F6D57" stroke-opacity="0.08"/>
