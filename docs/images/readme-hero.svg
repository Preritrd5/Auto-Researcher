    <rect x="786" y="392" width="138" height="48" rx="18" fill="#F4ECE0"/>
    <text x="855" y="422" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#445751">Runs &amp; Metrics</text>

    <rect x="786" y="452" width="138" height="48" rx="18" fill="#F4ECE0"/>
    <text x="855" y="482" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#445751">Research Chat</text>

    <rect x="786" y="518" width="138" height="56" rx="18" fill="#FBF5EA"/>
    <text x="804" y="540" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#0F6D57" letter-spacing="0.16em">BUDGET</text>
    <text x="804" y="566" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#172723">$0.00</text>

    <rect x="960" y="222" width="186" height="370" rx="24" fill="#FFFDF9"/>
    <text x="986" y="252" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#B06A18" letter-spacing="0.18em">PIPELINE STATUS</text>

