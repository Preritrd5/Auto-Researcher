  <g>
    <rect x="92" y="104" width="114" height="30" rx="15" fill="#E7F4EF"/>
    <text x="149" y="124" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F6D57" letter-spacing="0.24em">AUTO-RESEARCHER</text>

    <text x="92" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#172723">From idea to paper,</text>
    <text x="92" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#172723">with a durable research loop.</text>

    <text x="92" y="362" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#485B54">Self-hosted ML and AI research orchestration with a realtime dashboard,</text>
    <text x="92" y="396" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#485B54">multi-model routing, repair loops, artifacts, and bilingual operator UX.</text>
  </g>

