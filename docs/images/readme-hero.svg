    <text x="120" y="596" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#172723">Brief -> Literature -> Ideas -> Proposal -> Experiments -> Analysis -> Paper</text>
  </g>

