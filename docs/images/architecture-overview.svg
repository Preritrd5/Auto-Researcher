<svg width="1280" height="820" viewBox="0 0 1280 820" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Auto-Researcher Architecture Overview</title>
  <desc id="desc">System architecture diagram showing the frontend, API, worker, databases, providers, compute targets, and artifact store for Auto-Researcher.</desc>
  <defs>
    <linearGradient id="bg" x1="84" y1="52" x2="1192" y2="768" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8F3EA"/>
      <stop offset="1" stop-color="#EDE0CD"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F6D57"/>
      <stop offset="1" stop-color="#1D8B6E"/>
    </linearGradient>
    <linearGradient id="execution" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B06A18"/>
      <stop offset="1" stop-color="#D1892E"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1360" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#2F3936" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M1 1L11 7L1 13" stroke="#4A5D55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </marker>
  </defs>

  <rect width="1280" height="820" rx="36" fill="url(#bg)"/>

  <g opacity="0.34">
    <path d="M0 110H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M0 220H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M0 330H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M0 440H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M0 550H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M0 660H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M0 770H1280" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M180 0V820" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M360 0V820" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M540 0V820" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M720 0V820" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M900 0V820" stroke="#0F6D57" stroke-opacity="0.06"/>
    <path d="M1080 0V820" stroke="#0F6D57" stroke-opacity="0.06"/>
  </g>

  <text x="84" y="88" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0F6D57" letter-spacing="0.24em">ARCHITECTURE</text>
  <text x="84" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#172723">How Auto-Researcher</text>
  <text x="84" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#172723">stays durable end to end</text>
  <text x="84" y="238" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#55675F">Clear boundaries between UI, orchestration, durable state,</text>
  <text x="84" y="266" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="500" fill="#55675F">and execution runtime keep long research runs recoverable.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="286" width="320" height="252" rx="28" fill="#FFF9F1"/>
    <rect x="84.75" y="286.75" width="318.5" height="250.5" rx="27.25" stroke="#E8DAC4" stroke-width="1.5"/>
    <rect x="108" y="310" width="272" height="44" rx="18" fill="#E7F4EF"/>
    <text x="126" y="338" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F6D57" letter-spacing="0.18em">CONTROL PLANE</text>

    <rect x="108" y="378" width="272" height="104" rx="22" fill="url(#control)"/>
    <text x="132" y="408" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#DDF3EA" letter-spacing="0.16em">FRONTEND</text>
    <text x="132" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#FFFFFF">Next.js dashboard</text>
    <text x="132" y="458" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#EAF7F2">Setup, pipeline board, artifacts,</text>
    <text x="132" y="476" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#EAF7F2">chat, and runs.</text>

    <rect x="108" y="496" width="272" height="32" rx="16" fill="#F8F1E6"/>
    <text x="128" y="517" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#B06A18" letter-spacing="0.16em">API</text>
    <text x="364" y="517" text-anchor="end" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#172723">FastAPI + WebSockets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="480" y="286" width="320" height="252" rx="28" fill="#FFF9F1"/>
    <rect x="480.75" y="286.75" width="318.5" height="250.5" rx="27.25" stroke="#E8DAC4" stroke-width="1.5"/>
    <rect x="504" y="310" width="272" height="44" rx="18" fill="#E7F4EF"/>
    <text x="522" y="338" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0F6D57" letter-spacing="0.18em">ORCHESTRATION CORE</text>

    <rect x="504" y="378" width="272" height="104" rx="22" fill="url(#control)"/>
    <text x="528" y="408" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#DDF3EA" letter-spacing="0.16em">WORKER</text>
    <text x="528" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#FFFFFF">Durable worker loop</text>
    <text x="528" y="458" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#EAF7F2">Leases, retries, heartbeats,</text>
    <text x="528" y="476" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#EAF7F2">checkpoints, and recovery.</text>

    <rect x="504" y="496" width="128" height="24" rx="12" fill="#F8F1E6"/>
    <text x="568" y="512" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#51625C">Provider gateway</text>

    <rect x="648" y="496" width="128" height="24" rx="12" fill="#F8F1E6"/>
    <text x="712" y="512" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#51625C">Citation + retrieval</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="876" y="286" width="320" height="252" rx="28" fill="#FFF9F1"/>
    <rect x="876.75" y="286.75" width="318.5" height="250.5" rx="27.25" stroke="#E8DAC4" stroke-width="1.5"/>
    <rect x="900" y="310" width="272" height="44" rx="18" fill="#F6E6D4"/>
    <text x="918" y="338" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#B06A18" letter-spacing="0.18em">DURABLE STATE</text>

    <rect x="900" y="378" width="272" height="64" rx="22" fill="#FFFDF8"/>
    <text x="924" y="404" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#B06A18" letter-spacing="0.16em">POSTGRES + REDIS</text>
    <text x="924" y="422" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#172723">Runs, stages, tasks, events,</text>
    <text x="924" y="442" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#172723">memories, and budgets.</text>

    <rect x="900" y="454" width="272" height="62" rx="22" fill="#F8F1E6"/>
    <text x="924" y="480" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#B06A18" letter-spacing="0.16em">REALTIME FANOUT</text>
    <text x="924" y="502" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#172723">WebSocket events, logs, and artifact updates.</text>
  </g>

  <g stroke="#55675F" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M404 412H480"/>
    <path d="M800 412H876"/>
    <path d="M640 538V570"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="570" width="1112" height="152" rx="30" fill="#FFF9F1"/>
    <rect x="84.75" y="570.75" width="1110.5" height="150.5" rx="29.25" stroke="#E8DAC4" stroke-width="1.5"/>

    <rect x="110" y="596" width="224" height="44" rx="18" fill="#F6E6D4"/>
    <text x="128" y="624" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#B06A18" letter-spacing="0.18em">EXECUTION RUNTIME</text>

    <text x="110" y="668" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#172723">Local, Docker, and SSH targets</text>
    <text x="110" y="692" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#55675F">Reproducible commands, live logs, metric extraction,</text>
    <text x="110" y="712" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#55675F">checkpoints, and repair / degrade loops.</text>

    <rect x="840" y="596" width="330" height="100" rx="24" fill="url(#execution)"/>
    <text x="866" y="626" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFF7EA" letter-spacing="0.16em">RUN OUTPUTS</text>
    <rect x="866" y="642" width="116" height="26" rx="13" fill="#F5E2C4"/>
    <text x="924" y="659" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#7B4A12">stdout / stderr</text>
    <rect x="994" y="642" width="144" height="26" rx="13" fill="#F5E2C4"/>
    <text x="1066" y="659" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#7B4A12">run_metrics.json</text>
    <rect x="866" y="676" width="272" height="26" rx="13" fill="#F5E2C4"/>
    <text x="1002" y="693" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#7B4A12">workspace snapshot + generated paper assets</text>
  </g>

  <g>
    <rect x="126" y="754" width="1028" height="30" rx="15" fill="#FFF8EF"/>
    <text x="640" y="773" text-anchor="middle" font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#51625C">UI -&gt; API -&gt; Orchestrator -&gt; Runtime -&gt; State + artifacts -&gt; Live updates</text>
  </g>
</svg>
